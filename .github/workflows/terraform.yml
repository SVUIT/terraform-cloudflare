name: "Terraform Workflow"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: prd
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.WORKER_KV_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.NEW_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NEW_ACCESS_KEY }}
      TF_LOG: INFO
      tf_actions_working_dir: .
      
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4 

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: true
      
      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false
      
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 7

      - name: Comment on Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          VALIDATE_STDOUT: ${{ steps.validate.outputs.stdout }}
          WORKING_DIR: ${{ env.tf_actions_working_dir }}
          WORKFLOW_NAME: ${{ github.workflow }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style')
            );

            const output = [
              `#### Terraform Format and Style: \`${process.env.FMT_OUTCOME}\``,
              `#### Terraform Initialization: \`${process.env.INIT_OUTCOME}\``,
              `#### Terraform Validation: \`${process.env.VALIDATE_OUTCOME}\``,
              '<details><summary>Validation Output</summary>',
              '',
              '```',
              process.env.VALIDATE_STDOUT || '',
              '```',
              '',
              '</details>',
              '',
              `#### Terraform Plan: \`${process.env.PLAN_OUTCOME}\``,
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```',
              `terraform\n${process.env.PLAN_STDOUT || ''}`,
              '```',
              '',
              '</details>',
              '',
              `*Pusher: @${context.actor}, Action: \`${context.eventName}\`, Working Directory: \`${process.env.WORKING_DIR}\`, Workflow: \`${process.env.WORKFLOW_NAME}\`*`,
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            }

      - name: Terraform Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.plan.outcome == 'success'
        run: terraform apply -auto-approve tfplan
